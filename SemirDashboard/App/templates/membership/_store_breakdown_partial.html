{% if rows %}
<div class="table-responsive" style="max-height:1600px;overflow-y:auto;">
<table class="table table-striped table-hover align-middle mb-0" style="font-size:.86rem;">
<thead class="sticky-thead">
<tr>
    <th class="tbl-hdr-primary">Registration Store</th>
    {% for g in grades %}<th class="text-end tbl-hdr-primary">{{ g }}</th>{% endfor %}
    <th class="text-end tbl-hdr-primary">Total</th>
</tr>
</thead>
<tbody>
{% for row in rows %}
<tr>
    <td>{{ row.store }}</td>
    {% for c in row.counts %}<td class="text-end">{{ c }}</td>{% endfor %}
    <td class="text-end"><strong>{{ row.total }}</strong></td>
</tr>
{% endfor %}
</tbody>
</table>
</div>
{% else %}
<p class="text-muted small py-2 mb-0"><i class="bi bi-info-circle me-1"></i>No data for this snapshot.</p>
{% endif %}
