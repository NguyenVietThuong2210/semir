# Local development database ONLY — PostgreSQL 16, matching production's
# engine. This is separate from docker-compose.yml (the real prod stack:
# redis/db/web/nginx, pulled by scripts/deploy.sh on the server) so a local
# `docker compose up` never collides with prod's file. Local dev previously
# ran on SQLite; this gives Postgres-only code paths (GinIndex/trigram
# search, migration 0021) a real backend so tests exercise them instead of
# being skipped.
#
# Usage (from repo root):
#   docker compose -f docker-compose.local.yml up -d      # start
#   docker compose -f docker-compose.local.yml down       # stop (data persists in the volume)
#   docker compose -f docker-compose.local.yml down -v    # stop AND wipe the local dev database
services:
  db:
    image: postgres:16
    container_name: semir_local_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-semir_db}
      POSTGRES_USER: ${DB_USER:-semir_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-semir_local_dev_pw}
    ports:
      # 5433, not 5432 — deliberately avoids the port prod's docker-compose.yml
      # db service also binds, so this container can never collide with (or be
      # implicated in the cleanup of) a rogue prod-stack start on this machine
      # (happened twice in one session: something ran `docker compose up -d`
      # without `-f`, defaulting to docker-compose.yml, which killed this
      # container mid-test-run both times).
      - "5433:5432"
    volumes:
      - semir_local_pgdata:/var/lib/postgresql/data
    # Explicit cap so an overloaded host (e.g. Docker Desktop's WSL2 VM under
    # memory pressure from other work in the same session) makes Postgres
    # fail predictably (a visible OOM-killed container) instead of silently
    # starving/dying with no traceback — this happened at least once in
    # 2026-08-30's session with no clear cause. Adjust if legitimate load
    # (e.g. full test suite fixture imports) needs more headroom.
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-semir_user} -d ${DB_NAME:-semir_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  semir_local_pgdata:
